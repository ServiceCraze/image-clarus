[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-clarus"
version = "0.1.0"
description = "Image descriptions and structured metadata"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML", "jsonschema", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
image-clarus = "image_clarus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_clarus"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/image-description.txt" = "image_clarus/resources/prompts/image-description.txt"
