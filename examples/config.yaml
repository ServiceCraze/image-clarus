# Fictional placeholders: replace endpoint and model IDs before provider use.
# Set IMAGE_CLARUS_API_KEY in your environment; do not put credentials here.
providers:
  example:
    base_url: https://provider.example/v1
    api_key_env: IMAGE_CLARUS_API_KEY
    timeout_seconds: 60
models:
  vision:
    provider: example
    model_id: example-vision-model
  text:
    provider: example
    model_id: example-text-model
stages:
  desc:
    model: vision
  json:
    model: text
    validation_retries: 0
    include_prompt_sha256: false
    # Advisory complete paths or single segments; [] means no preference.
    preferred_categories: []
  xmp:
    # Omit for the same default; "" means no prefix and no tag deletions.
    tag_root: ai
    tag_limit: 10
    tag_policy: add
    title_policy: new
    caption_policy: new
    # Set a value only if you want to publish a caption author.
    caption_author: null
    caption_author_policy: new
    # Optional literal top-level metadata property names for custom schemas.
    custom_title_property: null
    custom_caption_property: null
    custom_tags_property: null
# Null permits discovery; a selected path names the initialized directory itself.
state:
  directory: null
  accumulate_categories: true
# Optional per-macro presentation settings; these never change stored paths.
prompt_expansion:
  macros:
    state.categories.known:
      delimiter: "/"
      max_depth: null
    config.stages.json.preferred_categories:
      delimiter: "/"
      max_depth: null
selection:
  max_depth: null
  extensions: [jpg, jpeg, png, webp, tif, tiff]
# Rebuild traversal depth is independent of process selection depth.
category_rebuild:
  max_depth: null
pipeline:
  # Omit missing_prerequisite to use fail for an explicit file and skip
  # for directories, native patterns, or multiple input tokens.
  max_work_files: null
  inter_stage_concurrency: true
  on_stage_failure: stop
  backup_retention: remove
logging:
  level: WARNING
